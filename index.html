  <title>Alifbo — Yangi o‘zbek alifbosi konverteri</title>
  <style>
*{box-sizing:border-box}body{margin:0;background:#f2f5ee;color:#183d30;font:16px/1.55 system-ui,sans-serif}main{max-width:880px;margin:auto;padding:24px 20px}header{font-size:25px;font-weight:800;border-bottom:1px solid #cbd7ca;padding-bottom:15px}h1{font-size:clamp(30px,6vw,52px);line-height:1.1;letter-spacing:-.045em;margin:30px 0 22px}article{background:white;border:1px solid #cad7cb;border-radius:20px;padding:clamp(16px,4vw,32px)}nav{display:flex;gap:5px;padding:4px;background:#edf2eb;border-radius:12px;margin-bottom:18px}button,select,textarea,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 18px;background:#e6efe2;color:#183d30}nav button{flex:1;font-weight:700}button[aria-pressed=true]{background:#204e3c;color:white}select{margin:4px 0 18px;padding:9px;border:1px solid #aabcae;border-radius:8px;background:white;width:100%}.edit{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:600}textarea{display:block;width:100%;min-height:145px;margin-top:5px;padding:12px;border:1px solid #bacabc;border-radius:10px}textarea[readonly]{background:#f5f8f2}aside{border:1px dashed #98b297;border-radius:12px;padding:20px}input{max-width:100%}small{color:#496251}p{margin:10px 0}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #80ad50}@media(max-width:600px){.edit{grid-template-columns:1fr}textarea{min-height:96px}}
#download{display:inline-block;background:#204e3c;color:white;border-radius:9px;padding:9px 18px;margin:4px 0;text-decoration:none}#download[hidden]{display:none}#status[data-ready]{display:flex;align-items:baseline;gap:10px;background:#e4f3df;border-inline-start:4px solid #34794a;border-radius:8px;padding:12px 14px;color:#183d30;font-weight:700;overflow-wrap:anywhere}#status[data-ready]::before{content:"✓";color:#246837}.file-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:8px}.file-buttons #choose,.file-buttons #download{display:grid;place-items:center;min-height:46px;margin:0;padding:10px 12px;text-align:center;line-height:1.35}.file-buttons #download[hidden]{display:none}@media(max-width:600px){.file-buttons{grid-template-columns:1fr}}
.file-buttons:has(#download[hidden]) #choose {
  grid-column: 1 / -1;
  background: #20523e;
  color: white;
  font-weight: 700;
  min-height: 52px;
}
.file-buttons:has(#download[hidden]) #choose:hover { background: #163e2e; }
</style></head><body><main><header>alifbo.</header><h1>Matn va fayllarni ögiriş</h1><article><nav aria-label="Konverter turi"><button id="textTab" aria-pressed="true">Matn</button><button id="fileTab" aria-pressed="false">Fayl</button></nav><label>Ögiriş yönalişi<select id="direction"><option value="latin">Eski alifbo → Yangi alifbo</option><option value="cyrillic">Kirill → Yangi alifbo</option><option value="reverse">Yangi alifbo → Eski alifbo</option></select></label><section id="textPanel"><div class="edit"><label>Matningiz<textarea id="source" placeholder="Matnni kiriting yoki joylang…"></textarea></label><label>Natija<textarea id="result" readonly></textarea></label></div><p><button hidden id="suggest">Kirilldan yangi alifboga o‘girish</button></p></section><section hidden id="filePanel"><aside><div class="file-buttons"><button id="choose" type="button">Fayl tanlang</button> <a id="download" hidden>Faylni yuklab oling</a></div><p>Word, Excel yoki PowerPoint</p><input hidden id="pick" type="file" accept=".docx,.xlsx,.pptx"></aside><p id="status" role="status"></p><small>Fayllar qurilmangizda qoladi.</small></section></article></main><script type="module" src="./src/main.js"></script></body></html>
